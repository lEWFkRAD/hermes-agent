name: sunshine-moonlight
repo: https://github.com/lEWFkRAD/hermes-plugin-sunshine-moonlight
sha: "a5b41b32cd1cc1be4aecf8ffe4594ae610385a13"
version: "0.1.0"
description: >-
  Set up and diagnose Moonlight game streaming (Sunshine host <-> Moonlight
  client) between machines that run Hermes. One tool, action-based: discover
  hosts on the tailnet/LAN, preflight ports, install+start Sunshine, pair
  clients, verify encoders, and launch a stream. Writes to remote machines
  only over SSH and only when the action says so.
title: Sunshine / Moonlight
maintainer: lEWFkRAD
tier: community
category: tools
docs_url: https://github.com/lEWFkRAD/hermes-plugin-sunshine-moonlight#readme
requires_hermes: ">=0.21.3"
platforms: [linux]
capabilities:
  provides_tools: [game_stream]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
